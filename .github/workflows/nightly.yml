name: nightly

# 13:00 UTC = 18:30 IST, Mon–Fri — after the bhavcopy with delivery data is published.
on:
  schedule:
    - cron: "0 13 * * 1-5"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "How many sessions to backfill into the panel"
        required: false
        default: "260"

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    # Phase 8 added per-symbol option-chain + financial-results fetches (each its own
    # cookie-dance round trip) — bumped from 45 after those pushed real runs close to it.
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs/requirements.txt

      - run: pip install -r jobs/requirements.txt

      # The OHLC panel and the raw NSE downloads are working files, not artifacts.
      # Cached between runs so a nightly run only fetches the sessions it is missing.
      - name: Restore working data
        uses: actions/cache@v4
        with:
          path: data
          key: panel-${{ github.run_id }}
          restore-keys: |
            panel-

      - name: Build artifacts
        env:
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '5' }}
          # Only for reading watchlist symbols + writing alert triggers — never for
          # market data, which stays entirely in out/*.json. Missing = watchlist charts
          # and alert evaluation are skipped, everything else still runs.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # News classification. Missing = news.json still writes, every item just
          # ships as "neutral" with no AI summary (jobs/news.py degrades, never fails).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m jobs.run_nightly

      - name: Show what was produced
        run: |
          ls -la out/
          echo "--- meta.json ---"
          cat out/meta.json

      - name: Commit artifacts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add out/
          if git diff --cached --quiet; then
            echo "no artifact changes"
          else
            git commit -m "chore: nightly artifacts $(date -u +%Y-%m-%d)"
            git push
          fi

name: nightly

# Three tries, Mon–Fri (UTC → IST): 13:37 = 7:07 PM, 15:07 = 8:37 PM, 17:23 = 10:53 PM.
# GitHub starts scheduled runs late under load and can drop them outright — the single
# 13:30 slot fired at 11:13 PM on 15-Sep and not at all on 16-Sep. Off-peak minutes are
# less congested, and the "already built today" guard below makes the later slots exit
# in seconds once any run (scheduled or manual) has produced today's artifacts.
on:
  schedule:
    - cron: "37 13 * * 1-5"
    - cron: "7 15 * * 1-5"
    - cron: "23 17 * * 1-5"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "How many sessions to backfill into the panel"
        required: false
        default: "260"

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    # Phase 8 added per-symbol option-chain + financial-results fetches (each its own
    # cookie-dance round trip) — bumped from 45 after those pushed real runs close to it.
    # Whole-market AI insights (docs/ai-insights.md) added ~2,900 NSE filing lookups +
    # ~195 paced Gemini calls (~9 RPM) on top of that — bumped again to 120.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      # Scheduled runs only: if main already has today's artifacts, stop here — no
      # NSE fetches, no Gemini quota spent, nothing overwritten. Manual runs always build.
      - name: Skip if today's artifacts already exist
        id: guard
        run: |
          today=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          built=$(python -c "import json; print(json.load(open('out/pulse.json')).get('as_of', ''))" 2>/dev/null || true)
          echo "today=$today built=$built event=${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$built" = "$today" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Artifacts for $today already on main — nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobs/requirements.txt

      - if: steps.guard.outputs.skip != 'true'
        run: pip install -r jobs/requirements.txt

      # The OHLC panel and the raw NSE downloads are working files, not artifacts.
      # Cached between runs so a nightly run only fetches the sessions it is missing.
      - if: steps.guard.outputs.skip != 'true'
        name: Restore working data
        uses: actions/cache@v4
        with:
          path: data
          key: panel-${{ github.run_id }}
          restore-keys: |
            panel-

      - if: steps.guard.outputs.skip != 'true'
        name: Build artifacts
        env:
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '5' }}
          # Only for reading watchlist symbols + writing alert triggers — never for
          # market data, which stays entirely in out/*.json. Missing = watchlist charts
          # and alert evaluation are skipped, everything else still runs.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # News classification, AI stock narrative, weekly market outlook. Missing =
          # those artifacts degrade (neutral/unclassified/skipped) — everything else
          # still runs (jobs/news.py, jobs/ai_insights.py, jobs/gemini.py all degrade,
          # never fail).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional second key — a 429 on the first rotates to this one (its own
          # separate quota) before backing off. Missing = single-key behavior.
          GEMINI_API_KEY_FALLBACK: ${{ secrets.GEMINI_API_KEY_FALLBACK }}
          # Weekly outlook's cross-week memory (jobs/memory.py). Missing = the outlook
          # still generates, it just starts from a blank slate every week instead of
          # grading its own prior call.
          MEM0_API_KEY: ${{ secrets.MEM0_API_KEY }}
          # Telegram push (jobs/telegram.py). Missing = no message, job unaffected.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Public site URL, used only to link the message back to the dashboard.
          SITE_URL: ${{ vars.SITE_URL }}
        run: python -m jobs.run_nightly

      - if: steps.guard.outputs.skip != 'true'
        name: Show what was produced
        run: |
          ls -la out/
          echo "--- meta.json ---"
          cat out/meta.json

      - if: steps.guard.outputs.skip != 'true'
        name: Commit artifacts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add out/
          if git diff --cached --quiet; then
            echo "no artifact changes"
          else
            git commit -m "chore: nightly artifacts $(date -u +%Y-%m-%d)"
            git push
          fi

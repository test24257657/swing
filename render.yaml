# Render blueprint for the FastAPI backend.
#
#   New > Blueprint > pick this repo.  Render reads this file and creates:
#     - swing-api    (web service — serves out/*.json from memory)
#     - swing-redis  (key-value — reserved for live quotes, unused for now)
#
# Secrets marked `sync: false` are NOT in this file. Set them in the Render
# dashboard after the first deploy (see DEPLOY.md step 3).

services:
  - type: web
    name: swing-api
    runtime: python
    rootDir: apps/api
    plan: free
    buildCommand: "pip install --upgrade pip && pip install ."
    # The app creates the `users` table and seeds the admin on startup
    # (app/bootstrap.py) — no migration step, no DB access at build time.
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true # redeploys when GitHub Actions commits fresh out/*.json
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENV
        value: production
      # OUT_DIR is not set — store.py defaults to <repo-root>/out, which is where
      # GitHub Actions commits the artifacts.
      - key: DATABASE_URL
        sync: false # Neon connection string, psycopg form: postgresql+psycopg://...?sslmode=require
      - key: SECRET_KEY
        generateValue: true # JWT signing key — Render generates and stores it
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false # your Vercel URL, e.g. https://swing-terminal.vercel.app
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: swing-redis
          property: connectionString

  - type: keyvalue
    name: swing-redis
    plan: free
    ipAllowList: [] # only reachable from Render services
    maxmemoryPolicy: allkeys-lru

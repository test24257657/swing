services:
  postgres:
    image: postgres:16-alpine
    container_name: swing-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swing}
      POSTGRES_DB: ${POSTGRES_DB:-swing}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swing}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: swing-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

[project]
name = "swing-api"
version = "0.0.0"
description = "Swing Terminal API — serves the nightly artifacts from memory; Postgres holds users only."
requires-python = ">=3.11"
# The API is deliberately light: it reads JSON files and does auth. All the heavy
# NSE / pandas / scraping work lives in /jobs with its own requirements.txt.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",       # starlette TestClient
    "alembic>=1.14",     # kept for local schema work; not on the deploy path
    "pandas>=2.2",       # the parked services/patterns modules still import it
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's Depends()-in-defaults is the framework's idiom, not a bug.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

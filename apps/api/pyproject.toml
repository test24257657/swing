[project]
name = "swing-api"
version = "0.0.0"
description = "Swing Terminal backend — FastAPI reads Postgres, a nightly job ingests NSE."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "redis>=5.2",
    "apscheduler>=3.11",
    "httpx>=0.28",
    "pandas>=2.2",
    "python-dateutil>=2.9",
    # NSE data sources — unofficial scrapers, pinned deliberately
    "nselib>=2.2",
    "jugaad-data>=0.26",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's Depends()-in-defaults is the framework's idiom, not a bug.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
